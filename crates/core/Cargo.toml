[package]
name = "purdungeon-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "purdungeon_core"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
pcap-parser = "0.16"
etherparse = "0.21"
rusqlite = { version = "0.34", features = ["bundled"] }
thiserror = "2"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
snmp-parser = "0.11"
# Live capture from a network interface (libpcap; Npcap on Windows). Optional
# so the headless core, its tests and the golden suite build without it.
pcap = { version = "2", optional = true }

[features]
capture = ["dep:pcap"]

[dev-dependencies]
serde_json = "1"
sha2 = "0.10"
