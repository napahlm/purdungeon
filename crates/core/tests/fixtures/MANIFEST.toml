# Committed fixture captures for the golden tests (tests/golden.rs).
#
# Each file is small enough to live in git. Its sha256 is asserted by the
# tests, so a line-ending conversion or a silent replacement fails loudly.
# The golden snapshots in tests/golden/ legitimately change when oui.toml or
# analysis/ports.rs change — regenerate with `just golden-update` and review
# the diff.
#
# All three come from CISA's ICSNPP Zeek analyzer packages (BSD-3-Clause,
# Battelle Energy Alliance, LLC). The licence and notice are reproduced in
# LICENSE-ICSNPP.txt and NOTICE-ICSNPP.txt as the licence requires.

