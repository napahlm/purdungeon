# Fetch-only test corpus: public captures too large to commit.
#
# `just fetch-corpus` downloads whatever is missing into this directory and
# verifies each file's sha256; the files themselves are gitignored. The
# golden snapshots (tests/golden/corpus-<name>.json) ARE committed, and
# `just golden-corpus` checks the fetched captures against them.
#
# 4SICS Geek Lounge captures: recorded at the 4SICS ICS security summit's
# lounge network (Stockholm, 2015) and published by Netresec. Netresec asks
# that CS3Sthlm be credited for allowing the traffic to be captured and
# shared when the dataset is redistributed or used in training.

