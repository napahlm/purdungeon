name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p purdungeon-core -p xtask --all-targets -- -D warnings
      # Golden snapshots are diffed here: a behaviour change that is not
      # reflected in tests/golden/*.json fails the build.
      - run: cargo test -p purdungeon-core

  licences:
    name: Licences (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build:vite

  windows:
    # The client-laptop reality: the core must pass on Windows (this is also
    # where a line-ending conversion of a fixture pcap would show up), and the
    # Tauri shell must at least type-check there.
    name: Core + shell (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: cargo test -p purdungeon-core
      # tauri::generate_context! embeds ../dist at compile time.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:vite
      - run: cargo check -p purdungeon
